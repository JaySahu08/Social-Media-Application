version: '3.9'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialapp
      POSTGRES_USER: socialuser
      POSTGRES_PASSWORD: socialpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialuser -d socialapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/socialapp
      DATABASE_USERNAME: socialuser
      DATABASE_PASSWORD: socialpass
      JWT_SECRET: change-this-to-a-long-random-secret-key-at-least-32-chars
      PORT: 8080
    ports:
      - "8080:8080"

  # ============================================
  # React Frontend (served by Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8080
    container_name: social-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data: