spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/socialapp}
    username: ${DATABASE_USERNAME:socialuser}
    password: ${DATABASE_PASSWORD:socialpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:local-dev-secret-change-me-12345678901234}
  expiration: 86400000