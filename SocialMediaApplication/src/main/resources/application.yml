spring:
  application:
    name: social-media

  datasource:
    url: jdbc:h2:mem:socialapp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

jwt:
  secret: my-super-secret-key-that-is-at-least-32-characters-long-change-me
  expiration: 86400000

logging:
  level:
    org.springframework.security: INFO
    com.SocialMediaApplication: DEBUG